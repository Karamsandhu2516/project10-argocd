apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: project10-eks-cluster
  region: us-east-1
  version: "1.36"   

iam:
  withOIDC: true

autoModeConfig:
  enabled: false    

managedNodeGroups:
  - name: ng-project10
    instanceType: t3.medium
    desiredCapacity: 2
    minSize: 2
    maxSize: 4
    volumeSize: 20